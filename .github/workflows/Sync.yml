name: Sync with Upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/risin42/NagramX.git
          git fetch upstream
          git merge upstream/base --no-edit --strategy-option=ours
          git push origin base
